name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./...
      - run: go test ./...
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      # Every platform must at least compile, with the page inside.
      - run: scripts/build-cli.sh ci
